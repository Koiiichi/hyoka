schema_version = "1.3"

[task]
name = "abundant-cyber-eval/privesc-uac-bypass-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (a real fodhelper UAC-bypass recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the cross-source privilege-escalation chain. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "privilege-escalation", "uac-bypass", "fodhelper", "sysmon"]

[metadata]
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_uac_shellapi_fodhelper. A fodhelper.exe UAC bypass (T1548.002): the attacker hijacks the HKCU ms-settings\\Shell\\Open\\command registry key to point at encoded PowerShell, then launches auto-elevating fodhelper.exe which runs the payload at high integrity. Ground truth is cross-source: the ms-settings\\Shell\\Open\\command registry writes (Sysmon 12/13 -- a needle among ~1000 benign registry events), the fodhelper.exe launch (Sysmon 1), and the elevated child process. flag-all-registry drowns the needle (precision ~0), flag-all-process is over-broad, and flagging only fodhelper misses the registry hijack that is the actual bypass mechanism. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
