schema_version = "1.3"

[task]
name = "abundant-cyber-eval/auth-log-lateral-movement-hunt"
description = "Threat-hunt a week of multi-host auth logs to find a real brute-force -> lateral-movement -> privesc -> exfil chain hidden in realistic benign noise."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "log-analysis", "mitre-attack", "lateral-movement"]

[metadata]
difficulty_explanation = "Requires correlating a compromised account across 3 host log files by username and time proximity, while rejecting two realistic look-alikes (a typo-then-success benign login and a scanner that never succeeds). Medium difficulty in the overall eval's spread."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
