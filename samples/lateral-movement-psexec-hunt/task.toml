schema_version = "1.3"

[task]
name = "abundant-cyber-eval/lateral-movement-psexec-hunt"
description = "Threat-hunt a SQLite database of real Windows Security + System + Sysmon logs (a real PsExec-style remote-execution recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the cross-source lateral-movement chain. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "lateral-movement", "psexec", "sysmon", "mitre-attack"]

[metadata]
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_psexec_dcerpc_tcp_svcctl. The malicious activity is a remote-service execution whose evidence is deliberately split across THREE log sources: the non-machine network logon (Security 4624 type 3, buried among benign machine-account logons), the suspicious service install in both Security (4697) and the System log (7045), and the service-spawned encoded-PowerShell process (Sysmon 1). No single event type or log source contains the whole chain, so cross-source correlation is required: flag-all-network-logons, flag-all-service-installs, and flag-all-process-creation each capture only a fragment and score low F1. Objective F1 vs behaviour-derived ground truth; no ambiguous label axis. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
