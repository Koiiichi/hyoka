schema_version = "1.3"

# Collected from the agent container and re-materialized at its original path
# inside the separate verifier container (/root/findings.json).
artifacts = ["/root/findings.json"]

[task]
name = "abundant-cyber-eval/uac-bypass-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (a real fodhelper UAC-bypass recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the cross-source privilege-escalation chain. Scored by F1 against Sigma/behaviour-derived ground truth."

[metadata]
author_name = "Muneeb Hassan"
author_email = "m57hassa@uwaterloo.ca"
category = "detection-engineering"
tags = ["cybersecurity", "soc", "threat-hunting", "privilege-escalation", "uac-bypass", "fodhelper", "sysmon"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_uac_shellapi_fodhelper. A fodhelper.exe UAC bypass (T1548.002): the attacker hijacks the HKCU ms-settings\\Shell\\Open\\command registry key to point at encoded PowerShell, then launches auto-elevating fodhelper.exe which runs the payload at high integrity. Ground truth is cross-source: the ms-settings\\Shell\\Open\\command registry writes (Sysmon 12/13 -- a needle among ~1000 benign registry events), the fodhelper.exe launch (Sysmon 1), and the elevated child process. flag-all-registry drowns the needle (precision ~0), flag-all-process is over-broad, and flagging only fodhelper misses the registry hijack that is the actual bypass mechanism. The professional who does this is a SOC threat hunter / detection engineer triaging raw endpoint telemetry. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
solution_explanation = "The UAC-bypass chain must be assembled from three cross-source facets. (1) The bypass mechanism: Sysmon 12/13 registry writes whose target_object is under the HKCU ms-settings\\Shell\\Open\\command key -- the hijack that redirects the auto-elevating handler, a needle among ~1000 benign registry events. (2) The trigger: the Sysmon 1 process creation whose image is fodhelper.exe (the auto-elevating binary the attacker launches). (3) The payload: the Sysmon 1 process creations whose parent_image is fodhelper.exe (the elevated child it spawns). The union of those events is the answer. The key insight is that the single obvious IOC (fodhelper launching) is not the whole story -- the registry hijack is the actual bypass and must be recovered from the noise, and the elevated child is the impact; only flagging all three facets scores high F1. ~15 lines of SQL express it."
verification_explanation = "The verifier reads the agent's /root/findings.json (collected as a declared artifact), parses it as a JSON list of event_id strings (dict items keyed event_id/id/eventid are also accepted), and computes precision, recall, and F1 by exact set arithmetic against tests/ground_truth.json, which is baked into the verifier image and never enters the agent container. The task passes iff F1 >= 0.99. With 7 ground-truth events this threshold is effectively exact-match and is not a fuzzy tolerance: a single spurious flag drops precision to 7/8 (F1 0.933) and a single miss drops recall to 6/7 (F1 0.923), both below 0.99, so 0.99 admits only the perfect set while sidestepping any floating-point edge of a literal == 1.0 comparison. reward.txt records the fractional F1 as a continuous signal."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
