schema_version = "1.3"

# Collected from the agent container and re-materialized at its original path
# inside the separate verifier container (/root/findings.json).
artifacts = ["/root/findings.json"]

[task]
name = "abundant-cyber-eval/vbs-launcher-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (a real Empire VBS-launcher execution recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the malicious script-host execution chain. Scored by F1 against Sigma/behaviour-derived ground truth."

[metadata]
author_name = "Muneeb Hassan"
author_email = "m57hassa@uwaterloo.ca"
category = "detection-engineering"
tags = ["cybersecurity", "soc", "threat-hunting", "execution", "script-host", "sysmon", "mitre-attack"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_launcher_vbs. WScript.exe runs a malicious .vbs from a user directory and spawns PowerShell (an Empire stager) which runs discovery and beacons out (T1059). Ground truth is the malicious process tree rooted at the script host plus that tree's network connections. The distinguishing signal is a process-lineage anomaly (a script host parenting a shell) plus C2, not a single event type: flag-scripthost-only misses the spawned shell/children/network, flag-all-process-creation misses the network and picks up benign processes, and flag-all-powershell is over-broad. The malicious chain is a handful of events among ~2000 of real Sysmon telemetry, found only by reconstructing the process tree. The professional who does this is a SOC threat hunter / detection engineer triaging raw endpoint telemetry. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
solution_explanation = "The malicious activity is a process tree, so reconstruct it by lineage rather than filtering one event type. Seed the tree with the script-host launcher: the Sysmon process creations (EventID 1) whose image is wscript.exe or cscript.exe. Then transitively close the tree over parent_process_guid -> process_guid: repeatedly add any process whose parent_process_guid is already in the tree (catching the spawned PowerShell stager and its children). Finally flag every event whose process_guid is in the tree that is a process creation (EventID 1) or a network connection (EventID 3, the C2 beacon). The union is the answer. The key insight is that the signal is a lineage anomaly (a script host parenting a shell) plus its network egress, invisible to any single-event-type filter; ~20 lines of SQL/Python express the tree walk."
verification_explanation = "The verifier reads the agent's /root/findings.json (collected as a declared artifact), parses it as a JSON list of event_id strings (dict items keyed event_id/id/eventid are also accepted), and computes precision, recall, and F1 by exact set arithmetic against tests/ground_truth.json, which is baked into the verifier image and never enters the agent container. The task passes iff F1 >= 0.99. With 5 ground-truth events this threshold is effectively exact-match and is not a fuzzy tolerance: a single spurious flag drops precision to 5/6 (F1 0.909) and a single miss drops recall to 4/5 (F1 0.889), both below 0.99, so 0.99 admits only the perfect set while sidestepping any floating-point edge of a literal == 1.0 comparison. reward.txt records the fractional F1 as a continuous signal."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
