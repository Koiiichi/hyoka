schema_version = "1.3"

[task]
name = "abundant-cyber-eval/discovery-account-enum-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (two real Empire account/group enumeration recordings from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the cross-source account-discovery activity. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "discovery", "account-enumeration", "sysmon", "mitre-attack"]

[metadata]
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Sources: empire_shell_net_localgroup_administrators + empire_shell_net_local_users, combined into one campaign. Account/group discovery leaves evidence split across two log sources: the reconnaissance commands (Sysmon 1, net.exe/net1.exe with localgroup/user/group arguments) and the Windows Security membership-enumeration audit (4798/4799). Ground truth is the union of both. This is deliberately cross-source: flag-net.exe-only captures the Sysmon side but misses every Security 4798/4799 event, and flagging the Security events misses the recon commands; flag-all-process-creation and flag-all-powershell drown in benign volume. Discovery telemetry is low-signal and interleaved with high-volume Sysmon/PowerShell logging, so the malicious subset is a small fraction requiring correlation across Sysmon + Security. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
