schema_version = "1.3"

[task]
name = "abundant-cyber-eval/threat-hunt-windows-eventlogs"
description = "Threat-hunt a SQLite database of ~6,000 real Windows Security and Sysmon event logs (a real Empire+Mimikatz credential-theft campaign from the OTRF Security-Datasets corpus, deterministically time-shifted and entity-obfuscated) with no hints, and flag the exact malicious events. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "windows-eventlogs", "sysmon", "credential-access", "mitre-attack"]

[metadata]
difficulty_explanation = "Replicates the Cyber Defense Benchmark method (arXiv 2604.19533): a real attack recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated, loaded into a queryable SQLite DB of ~6,000 real events. The agent must threat-hunt with NO hints (no indicators, no time range, no affected host) and flag the malicious events (35 C2 network connections + 2 lsass memory reads from one confirmed-malicious powershell process, 0.6% of the corpus). Scored by F1 against Sigma/behaviour-derived ground truth -- fully objective, no ambiguous label axis. This is the source of genuine headroom that hand-authored synthetic tasks lacked: the referenced benchmark reports every frontier model failing (best ~3.8% of malicious events flagged; Gemini 3 Flash fails hard). Difficulty comes from real, high-volume, messy telemetry with no guidance, not from a hidden trick. Data: OTRF Security-Datasets (GPL-3.0), vendored and obfuscated; source generator and labels are removed from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
