schema_version = "1.3"

# Collected from the agent container and re-materialized at its original path
# inside the separate verifier container (/root/findings.json).
artifacts = ["/root/findings.json"]

[task]
name = "abundant-cyber-eval/run-key-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (a real Empire Run-key persistence recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the malicious process's persistence and C2 activity. Scored by F1 against Sigma/behaviour-derived ground truth."

[metadata]
author_name = "Muneeb Hassan"
author_email = "m57hassa@uwaterloo.ca"
category = "detection-engineering"
tags = ["cybersecurity", "soc", "threat-hunting", "persistence", "registry-run-keys", "sysmon", "mitre-attack"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_persistence_registry_modification_run_keys_elevated_user. The malicious process establishes Run-key persistence (Sysmon 13, a value under CurrentVersion\\Run pointing at encoded PowerShell) and beacons to C2 (Sysmon 3). Ground truth is that process's persistence write plus its C2 connections. Registry writes (Sysmon 12/13) and network connections (Sysmon 3) both occur benignly in volume, so flag-all-registry and flag-all-network each capture only a fragment; flagging only the Run-key write (the single obvious IOC) misses the beaconing. High-volume subtle signal: the malicious Run-key write is one of many registry sets, separable only by the specific CurrentVersion\\Run target correlated to a process that also beacons. The professional who does this is a SOC threat hunter / detection engineer triaging raw endpoint telemetry. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
solution_explanation = "The malicious process is identified by its persistence write, then its full footprint is recovered by correlation. First find the process_guid of any Sysmon 13 registry-value-set whose target_object is under CurrentVersion\\Run (the Run-key persistence IOC). That process is confirmed malicious. Then flag every event sharing that process_guid that is either the Run-key write itself (Sysmon 13 under CurrentVersion\\Run) or a network connection (Sysmon 3, the C2 beacons). The union is the answer. The key insight is that the single obvious IOC (the Run-key value) is not the whole answer — the malicious process also beacons, and only correlating the persistence write to the same process's network connections via process_guid recovers the full footprint without drowning in the many benign registry and network events; ~20 lines of SQL express it."
verification_explanation = "The verifier reads the agent's /root/findings.json (collected as a declared artifact), parses it as a JSON list of event_id strings (dict items keyed event_id/id/eventid are also accepted), and computes precision, recall, and F1 by exact set arithmetic against tests/ground_truth.json, which is baked into the verifier image and never enters the agent container. The task passes iff F1 >= 0.99. With 11 ground-truth events this threshold is effectively exact-match and is not a fuzzy tolerance: a single spurious flag drops precision to 11/12 (F1 0.957) and a single miss drops recall to 10/11 (F1 0.952), both below 0.99, so 0.99 admits only the perfect set while sidestepping any floating-point edge of a literal == 1.0 comparison. reward.txt records the fractional F1 as a continuous signal."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
