schema_version = "1.3"

# Collected from the agent container and re-materialized at its original path
# inside the separate verifier container (/root/findings.json).
artifacts = ["/root/findings.json"]

[task]
name = "abundant-cyber-eval/lolbin-injection-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon logs (a real wuauclt LOLBin + CreateRemoteThread injection recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the injection chain. Scored by F1 against Sigma/behaviour-derived ground truth."

[metadata]
author_name = "Muneeb Hassan"
author_email = "m57hassa@uwaterloo.ca"
category = "detection-engineering"
tags = ["cybersecurity", "soc", "threat-hunting", "defense-evasion", "process-injection", "lolbin", "sysmon"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: covenant_lolbin_wuauclt_createremotethread. wuauclt.exe (the Windows Update client) is abused as a LOLBin (/UpdateDeploymentProvider) to load an attacker DLL from outside C:\\Windows and inject into another process via CreateRemoteThread (T1055 / T1218). Ground truth is the injector's footprint across THREE different Sysmon event types: the wuauclt process creation (EventID 1), the load of a non-Windows DLL (EventID 7, a needle among ~180 benign image loads), and the CreateRemoteThread (EventID 8). No single event type is the whole signal: flag-createremotethread-only misses the process and DLL load, flag-all-image-loads drowns the needle, and flag-all-process-creation misses the load and the thread. The professional who does this is a SOC threat hunter / detection engineer triaging raw endpoint telemetry. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
solution_explanation = "The injector is the source process of the only CreateRemoteThread (Sysmon EventID 8) in the telemetry. Its process_guid is the pivot that ties the intrusion's three-facet footprint together: select that GUID from the EventID 8 rows, then collect every event sharing it that is either a process creation (EventID 1) or the CreateRemoteThread itself (EventID 8), plus its single DLL load from outside C:\\Windows (EventID 7) — the one malicious image load among ~180 benign ones. The union of those events is the answer. The key insight is that no single event type is the whole signal, so the solver must correlate across event types by process_guid rather than filter on any one indicator; ~20 lines of SQL/Python express this directly."
verification_explanation = "The verifier reads the agent's /root/findings.json (collected as a declared artifact), parses it as a JSON list of event_id strings (dict items keyed event_id/id/eventid are also accepted), and computes precision, recall, and F1 by exact set arithmetic against tests/ground_truth.json, which is baked into the verifier image and never enters the agent container. The task passes iff F1 >= 0.99. With only 3 ground-truth events this threshold is effectively exact-match and is not a fuzzy tolerance: a single spurious flag drops precision to 0.75 (F1 0.857) and a single miss drops recall to 0.67 (F1 0.80), both far below 0.99, so 0.99 admits only the perfect set while sidestepping any floating-point edge of a literal == 1.0 comparison. reward.txt records the fractional F1 as a continuous signal."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
