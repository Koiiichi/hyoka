schema_version = "1.3"

[task]
name = "abundant-cyber-eval/execution-vbs-launcher-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon + Security logs (a real Empire VBS-launcher execution recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the malicious script-host execution chain. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "execution", "script-host", "sysmon", "mitre-attack"]

[metadata]
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: empire_launcher_vbs. WScript.exe runs a malicious .vbs from a user directory and spawns PowerShell (an Empire stager) which runs discovery and beacons out (T1059). Ground truth is the malicious process tree rooted at the script host plus that tree's network connections. The distinguishing signal is a process-lineage anomaly (a script host parenting a shell) plus C2, not a single event type: flag-scripthost-only misses the spawned shell/children/network, flag-all-process-creation misses the network and picks up benign processes, and flag-all-powershell is over-broad. The malicious chain is a handful of events among ~2000 of real Sysmon telemetry, found only by reconstructing the process tree. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
