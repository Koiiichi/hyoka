schema_version = "1.3"

[task]
name = "abundant-cyber-eval/defense-evasion-injection-hunt"
description = "Threat-hunt a SQLite database of real Windows Sysmon logs (a real wuauclt LOLBin + CreateRemoteThread injection recording from OTRF Security-Datasets, deterministically time-shifted and entity-obfuscated) with no hints, and flag the injection chain. Scored by F1 against Sigma/behaviour-derived ground truth."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "soc", "threat-hunting", "defense-evasion", "process-injection", "lolbin", "sysmon"]

[metadata]
difficulty_explanation = "Confirmed OTRF template (arXiv 2604.19533). Source: covenant_lolbin_wuauclt_createremotethread. wuauclt.exe (the Windows Update client) is abused as a LOLBin (/UpdateDeploymentProvider) to load an attacker DLL from outside C:\\Windows and inject into another process via CreateRemoteThread (T1055 / T1218). Ground truth is the injector's footprint across THREE different Sysmon event types: the wuauclt process creation (EventID 1), the load of a non-Windows DLL (EventID 7, a needle among ~180 benign image loads), and the CreateRemoteThread (EventID 8). No single event type is the whole signal: flag-createremotethread-only misses the process and DLL load, flag-all-image-loads drowns the needle, and flag-all-process-creation misses the load and the thread. Objective F1 vs behaviour-derived ground truth. Data: OTRF Security-Datasets (GPL-3.0), vendored + obfuscated; source generator/labels stripped from the runtime image."
category = "detection-engineering"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
