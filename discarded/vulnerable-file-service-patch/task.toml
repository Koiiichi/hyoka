schema_version = "1.3"

[task]
name = "abundant-cyber-eval/vulnerable-file-service-patch"
description = "Patch a path-traversal (CWE-22) vulnerability in a runnable Flask file-distribution service so that an executed security test suite (multiple traversal techniques) passes without regressing an executed functional test suite. Execution-based verification."
authors = [{ name = "Muneeb Hassan", email = "m57hassa@uwaterloo.ca" }]
keywords = ["cybersecurity", "appsec", "vulnerability-repair", "path-traversal", "cwe-22", "execution-based"]

[metadata]
difficulty_explanation = "Execution-based verification adapted from the CVE-Bench / VulnRepairEval pattern (arXiv 2503.17332 SOTA ~13%; arXiv 2509.03331 top model ~21.7%). The agent edits a runnable service in place; the verifier RUNS a security suite (relative, absolute, nested, and URL-encoded traversal vectors) and a functional suite, and passes only if all of both succeed. This resists the failure mode of the earlier synthetic tasks: a naive single-pattern blocklist still leaks via the absolute-path and encoded vectors (security suite fails), and an over-aggressive fix that disables the endpoint breaks legitimate downloads (functional suite fails). Only a correct canonicalize-and-confine fix passes. Difficulty comes from real runtime behavior verified by execution, not from a hidden signal in synthetic data."
category = "vulnerability-repair"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
allow_internet = true
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
